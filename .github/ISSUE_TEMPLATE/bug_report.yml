name: Synthetic bug report
description: Report a reproducible defect using public-safe synthetic evidence only.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not submit real receipts, invoices, databases, logs, screenshots with personal data,
        credentials, tokens, or security vulnerabilities. Use GitHub private vulnerability reporting
        for security issues. Issues are disabled for the initial preview; this form is retained for a
        later maintainer-approved enablement.
  - type: input
    id: commit
    attributes:
      label: Clerk-san commit
      description: Exact public commit SHA where the problem occurs.
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the outcome without private document content or raw logs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest deterministic reproduction using synthetic values.
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime path
      options:
        - Host Ollama + SQLite launcher
        - Advanced Compose runtime
        - Source or test only
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I included no real documents, personal data, secrets, or security-vulnerability details.
          required: true
